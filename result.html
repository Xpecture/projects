<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="result-box">
        <h2>🔍 Prediction Result</h2>
        {% if result == "normal" %}
            <p class="safe">✅ This traffic is NORMAL</p>
        {% else %}
            <p class="danger">⚠ This traffic is an ATTACK</p>
        {% endif %}
        <a href="/">🔙 Go Back</a>
    </div>
</body>
</html>
